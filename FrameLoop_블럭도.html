<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameLoop — AI 영상 자동 개선 파이프라인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #080a14;
  --surface:#0f1221;
  --card:   #141829;
  --border: #1e2440;
  --border2:#2a3158;
  --fg:     #dde3f8;
  --mute:   #6d7a9f;
  --mute2:  #4d5878;

  --user:   #7c6cf5;
  --flask:  #3b82f6;
  --ai:     #a855f7;
  --db:     #10b981;
  --ext:    #f59e0b;
  --yt:     #ef4444;
  --mix:    #14b8a6;

  --radius-node: 10px;
  --font: 'Noto Sans KR', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

html { background: var(--bg); color: var(--fg); font-family: var(--font); }

body {
  min-height: 100vh;
  padding: 24px clamp(16px, 4vw, 48px) 36px;
}

.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* ── Header ── */
.hdr { display: flex; flex-direction: column; gap: 6px; }
.hdr h1 {
  font-size: clamp(1rem, 2.2vw, 1.22rem);
  font-weight: 900;
  letter-spacing: -.02em;
  color: var(--fg);
}
.hdr p { font-size: .8rem; color: var(--mute); line-height: 1.55; }

/* ── Legend ── */
.legend {
  display: flex; flex-wrap: wrap; gap: 4px 14px;
  font-size: .75rem; color: var(--mute);
}
.legend span { display: flex; align-items: center; gap: 5px; }
.legend b {
  width: 9px; height: 9px; border-radius: 3px;
  display: inline-block; flex-shrink: 0;
}

/* ── Diagram stage ── */
.stage {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 8px 4px;
  overflow-x: auto;
  /* inner shadow for depth */
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
svg {
  display: block;
  width: 100%;
  min-width: 700px;
  height: auto;
}

/* ── Node styles ── */
.node { transition: opacity .35s ease; cursor: default; }
.node rect { transition: opacity .35s ease, filter .35s ease; }
.node text { fill: #fff; font-family: var(--font); pointer-events: none; }
.node .tl { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.node .sl { font-size: 10px; opacity: .78; }

.dim { opacity: .16; }
.lit rect { filter: drop-shadow(0 0 12px currentColor); }

/* ── Edge styles ── */
.edge {
  fill: none;
  stroke-width: 2;
  stroke-dasharray: 8 5;
  opacity: .14;
  transition: opacity .35s ease;
}
.edge.on { opacity: 1; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -26; } }

/* ── Progress bar ── */
.progbar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progbar span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--user) 0%, var(--ai) 50%, var(--yt) 100%);
  transition: width .5s ease;
  border-radius: 2px;
}

/* ── Caption box ── */
.caption {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px;
  min-height: 4.2em;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.caption .step-num {
  font-size: .7rem;
  font-family: var(--mono);
  color: var(--mute2);
  letter-spacing: .06em;
  text-transform: uppercase;
}
.caption strong {
  font-size: .96rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.3;
}
.caption p {
  font-size: .84rem;
  color: var(--mute);
  line-height: 1.6;
  max-width: 72ch;
}

/* ── Controls ── */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.dots { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; }
.dots button {
  width: 26px; height: 26px; border-radius: 50%;
  font-size: .68rem; font-family: var(--mono); font-weight: 600;
  padding: 0;
  background: var(--card); border: 1px solid var(--border);
  color: var(--mute); cursor: pointer;
  transition: background .2s, border-color .2s, color .2s;
}
.dots button:hover { border-color: var(--border2); color: var(--fg); }
.dots button.cur { background: var(--user); border-color: var(--user); color: #fff; }

.btn {
  font: 500 .82rem / 1 var(--font);
  padding: 9px 20px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; color: var(--fg); cursor: pointer;
  transition: border-color .2s, background .2s;
}
.btn:hover { border-color: var(--border2); }
.btn.primary {
  background: var(--user); border-color: var(--user); color: #fff;
}
.btn.primary:hover { background: #9585f8; border-color: #9585f8; }

@media (prefers-reduced-motion: reduce) { .edge.on { animation: none; } }
</style>
</head>

    <h1>FrameLoop — AI 영상 자동 개선 파이프라인 구조도</h1>

var IDS = ['user','flask','llm','kling','tts','ffmpeg','outro','ytup','yt','filter','db','classify','cluster'];
var EDGES = Array.from(document.querySelectorAll('.edge')).map(function(el){ return el.id; });
var cur = 0, timer = null, N = STEPS.length;

function render() {
  var s = STEPS[cur];
  IDS.forEach(function(id) {
    var g = document.getElementById('n-' + id);
    var on = s.all || (s.nodes && s.nodes.indexOf(id) !== -1);
    g.classList.toggle('dim', !on);
    g.classList.toggle('lit', !!on && !s.all);
  });
  EDGES.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle('on', !!s.all || (s.edges && s.edges.indexOf(id) !== -1));
  });
  document.getElementById('stepnum').textContent = 'STEP ' + (cur + 1) + ' / ' + N;
  document.getElementById('ct').textContent = s.t;
  document.getElementById('cd').textContent = s.d;
  document.getElementById('prog').style.width = ((cur + 1) / N * 100) + '%';
  document.querySelectorAll('#dots button').forEach(function(b, i) {
    b.classList.toggle('cur', i === cur);
  });
}

function go(n) { cur = (n + N) % N; render(); }

function stop() {
  clearInterval(timer); timer = null;
  var btn = document.getElementById('play');
  btn.textContent = '▶ 자동 재생';
  btn.classList.add('primary');
}

function play() {
  if (timer) { stop(); return; }
  var btn = document.getElementById('play');
  btn.textContent = '⏸ 일시정지';
  btn.classList.add('primary');
  timer = setInterval(function() {
    if (cur >= N - 1) { stop(); return; }
    go(cur + 1);
  }, 3800);
}

// 도트 생성
var dotsEl = document.getElementById('dots');
STEPS.forEach(function(s, i) {
  var b = document.createElement('button');
  b.textContent = i < N - 1 ? String(i + 1) : '✓';
  b.setAttribute('aria-label', s.t);
  b.onclick = function() { stop(); go(i); };
  dotsEl.appendChild(b);
});

document.getElementById('prev').onclick = function() { stop(); go(cur - 1); };
document.getElementById('next').onclick = function() { stop(); go(cur + 1); };
document.getElementById('play').onclick = function() { if (cur >= N - 1) go(0); play(); };

// 키보드 지원
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft')  { stop(); go(cur - 1); }
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === ' ') { e.preventDefault(); if (cur >= N - 1) go(0); play(); }
});

render();
</script>
